<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" role="img" aria-labelledby="title desc">
  <title id="title">Ocean waves</title>
  <desc id="desc">Layered blue ocean waves flowing gently above Bruna Antelo's name.</desc>
  <defs>
    <clipPath id="wave-clip">
      <rect width="1000" height="130" />
    </clipPath>
    <linearGradient id="ocean-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58A6FF" stop-opacity=".72" />
      <stop offset="1" stop-color="#1F6FEB" stop-opacity=".45" />
    </linearGradient>
    <linearGradient id="ocean-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F81F7" stop-opacity=".85" />
      <stop offset="1" stop-color="#0A4DAA" stop-opacity=".72" />
    </linearGradient>
    <linearGradient id="ocean-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity=".9" />
      <stop offset="1" stop-color="#0B2F63" stop-opacity=".88" />
    </linearGradient>
  </defs>
  <g clip-path="url(#wave-clip)" fill="none" stroke-linecap="round">
    <g opacity=".95">
      <path d="M-400 50 C-300 0 -100 0 0 50 S300 100 400 50 S700 0 800 50 S1100 100 1200 50 S1500 0 1600 50" stroke="#58A6FF" stroke-width="32">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="12s" repeatCount="indefinite" />
      </path>
    </g>
    <g opacity=".95">
      <path d="M-400 78 C-300 34 -100 34 0 78 S300 122 400 78 S700 34 800 78 S1100 122 1200 78 S1500 34 1600 78" stroke="#1F6FEB" stroke-width="25">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="9s" repeatCount="indefinite" />
      </path>
    </g>
    <g opacity=".98">
      <path d="M-400 105 C-300 69 -100 69 0 105 S300 141 400 105 S700 69 800 105 S1100 141 1200 105 S1500 69 1600 105" stroke="#2F81F7" stroke-width="18">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="7s" repeatCount="indefinite" />
      </path>
    </g>
    <path d="M-400 42 C-300 -8 -100 -8 0 42 S300 92 400 42 S700 -8 800 42 S1100 92 1200 42 S1500 -8 1600 42" stroke="#A5D6FF" stroke-opacity=".9" stroke-width="3" />
    <path d="M-400 70 C-300 26 -100 26 0 70 S300 114 400 70 S700 26 800 70 S1100 114 1200 70 S1500 26 1600 70" stroke="#79C0FF" stroke-opacity=".85" stroke-width="2.5" />
  </g>
</svg>

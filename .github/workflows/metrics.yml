name: Metrics

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Skip if token is missing
        if: ${{ env.METRICS_TOKEN == '' }}
        run: echo "Skipping metrics workflow because METRICS_TOKEN is not configured."

      # ------------------------------------------------------------------ #
      # Language breakdown (bytes-weighted, recent-activity weighted)
      # ------------------------------------------------------------------ #
      - name: Languages
        if: ${{ env.METRICS_TOKEN != '' }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: brunitaa
          filename: assets/metrics.languages.svg
          base: ""
          config_timezone: America/La_Paz
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: no
          plugin_languages_sections: most-used

name: Metrics

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    if: ${{ secrets.METRICS_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------ #
      # Language breakdown (bytes-weighted, recent-activity weighted)
      # ------------------------------------------------------------------ #
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: brunitaa
          filename: assets/metrics.languages.svg
          base: ""
          config_timezone: America/La_Paz
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: no
          plugin_languages_sections: most-used

  metrics-skip:
    if: ${{ secrets.METRICS_TOKEN == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip metrics without token
        run: echo "Skipping metrics workflow because METRICS_TOKEN is not configured."
